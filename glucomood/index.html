<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GlucoMood</title>
    <meta name="description" content="GlucoMood — a friendly diabetes companion for manual logging, movement motivation, and supportive Mimi AI conversations.">
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fff5ec;
            --card: #ffffff;
            --text: #24120d;
            --muted: #6f554b;
            --accent: #f26a2e;
            --border: rgba(117, 75, 48, 0.18);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1f0e08;
                --card: #2d160f;
                --text: #fff8f1;
                --muted: #e6c4b0;
                --accent: #ff9a4a;
                --border: rgba(255, 185, 116, 0.24);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, rgba(255, 167, 79, 0.26), transparent 34%), var(--bg);
            color: var(--text);
            line-height: 1.55;
        }

        header.hero {
            width: min(720px, calc(100% - 40px));
            margin: 0 auto;
            padding: 64px 0 32px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 18px 46px rgba(55, 24, 8, 0.16);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2.4rem, 8vw, 4.4rem);
            line-height: 0.95;
            letter-spacing: -0.05em;
        }

        header.hero p {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 1.08rem;
        }

        header.hero nav {
            display: grid;
            gap: 12px;
        }

        a {
            color: var(--accent);
            font-weight: 800;
            text-decoration: none;
        }

        .link-card {
            display: block;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px 18px;
            background: color-mix(in srgb, var(--card) 86%, var(--accent));
        }

        main.gallery {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 8px 0 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        main.gallery button.shot {
            display: block;
            width: 100%;
            padding: 0;
            margin: 0;
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            background: none;
            cursor: zoom-in;
            box-shadow: 0 14px 36px rgba(55, 24, 8, 0.14);
        }

        main.gallery button.shot img {
            display: block;
            width: 100%;
            height: auto;
        }

        footer {
            width: min(720px, calc(100% - 40px));
            margin: 0 auto;
            padding: 24px 0 72px;
            text-align: center;
        }

        footer p.disclaimer {
            color: var(--muted);
            font-size: 0.92rem;
            margin: 0 0 18px;
        }

        footer .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 22px;
        }

        footer .links a {
            font-size: 0.95rem;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(10, 4, 2, 0.86);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            cursor: zoom-out;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .lightbox .close-hint {
            position: absolute;
            top: 18px;
            right: 22px;
            color: #fff8f1;
            font-size: 0.85rem;
            font-weight: 700;
            opacity: 0.78;
        }
    </style>
</head>
<body>
    <header class="hero">
        <section class="card">
            <h1>GlucoMood</h1>
            <p>A friendly diabetes companion for manual logging, movement motivation, and supportive Mimi AI conversations.</p>
        </section>
    </header>

    <main class="gallery">
        <button class="shot" data-full="assets/marketing-01-tracker.png">
            <img src="assets/marketing-01-tracker.png" alt="GlucoMood Tracker — see your numbers, understand your body, take control of your day." loading="lazy">
        </button>
        <button class="shot" data-full="assets/marketing-02-movement.png">
            <img src="assets/marketing-02-movement.png" alt="Movement in Food Form — see your steps, get moving, discover what your activity adds up to." loading="lazy">
        </button>
        <button class="shot" data-full="assets/marketing-03-mimi.png">
            <img src="assets/marketing-03-mimi.png" alt="Mimi AI — your GlucoMood AI companion, always here for you day or night." loading="lazy">
        </button>
        <button class="shot" data-full="assets/marketing-04-logs.png">
            <img src="assets/marketing-04-logs.png" alt="Logs — your health history, together." loading="lazy">
        </button>
        <button class="shot" data-full="assets/marketing-05-profile.png">
            <img src="assets/marketing-05-profile.png" alt="Profile — your GlucoMood, your way." loading="lazy">
        </button>
    </main>

    <footer>
        <p class="disclaimer">GlucoMood is supportive wellness software, not medical diagnosis, treatment, or emergency care.</p>
        <nav class="links" aria-label="Legal and support links">
            <a href="./privacy/">Privacy Policy</a>
            <a href="./terms/">Terms of Service</a>
            <a href="https://mail.google.com/mail/?view=cm&fs=1&tf=1&to=bentulj4@gmail.com">Support</a>
        </nav>
    </footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged screenshot">
        <span class="close-hint">Tap to close</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        document.querySelectorAll('button.shot').forEach((button) => {
            button.addEventListener('click', () => {
                const full = button.getAttribute('data-full');
                const alt = button.querySelector('img').getAttribute('alt');
                lightboxImg.src = full;
                lightboxImg.alt = alt;
                lightbox.classList.add('open');
            });
        });

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('open');
            lightboxImg.src = '';
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                lightbox.classList.remove('open');
                lightboxImg.src = '';
            }
        });
    </script>
</body>
</html>
