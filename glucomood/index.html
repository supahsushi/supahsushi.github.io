<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GlucoMood</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fff5ec;
            --card: #ffffff;
            --text: #24120d;
            --muted: #6f554b;
            --accent: #f26a2e;
            --border: rgba(117, 75, 48, 0.18);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1f0e08;
                --card: #2d160f;
                --text: #fff8f1;
                --muted: #e6c4b0;
                --accent: #ff9a4a;
                --border: rgba(255, 185, 116, 0.24);
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, rgba(255, 167, 79, 0.26), transparent 34%), var(--bg);
            color: var(--text);
            line-height: 1.55;
        }

        main {
            width: min(720px, calc(100% - 40px));
            margin: 0 auto;
            padding: 64px 0;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 18px 46px rgba(55, 24, 8, 0.16);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2.4rem, 8vw, 4.4rem);
            line-height: 0.95;
            letter-spacing: -0.05em;
        }

        p {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 1.08rem;
        }

        nav {
            display: grid;
            gap: 12px;
        }

        a {
            color: var(--accent);
            font-weight: 800;
            text-decoration: none;
        }

        .link-card {
            display: block;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px 18px;
            background: color-mix(in srgb, var(--card) 86%, var(--accent));
        }
    </style>
</head>
<body>
    <main>
        <section class="card">
            <h1>GlucoMood</h1>
            <p>A friendly diabetes companion for manual logging, movement motivation, and supportive Mimi AI conversations.</p>
            <nav aria-label="Legal pages">
                <a class="link-card" href="./privacy/">Privacy Policy</a>
                <a class="link-card" href="./terms/">Terms of Service</a>
            </nav>
        </section>
    </main>
</body>
</html>
